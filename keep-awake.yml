name: Keep app awake (LaunchCast)

on:
  schedule:
    # 12pm–midnight ET approximately; adjust seasonally if desired.
    - cron: "*/15 16-23 * * *"
    - cron: "*/15 0-4 * * *"
  workflow_dispatch:

concurrency:
  group: launchcast-keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Light ping
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL is not set; skipping."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 60 "$APP_URL" || echo "000")
          echo "Keep-alive ping returned HTTP $code"
          exit 0
